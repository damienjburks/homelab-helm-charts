{{- if .Values.wazuh.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-cloudflared-wazuh-pvc
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/component: cloudflared-wazuh-agent
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.wazuh.persistence.storageClass | quote }}
  resources:
    requests:
      storage: {{ .Values.wazuh.persistence.size | quote }}
{{- end }}
