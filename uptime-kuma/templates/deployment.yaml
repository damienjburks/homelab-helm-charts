apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      nodeName: dsb-pi5-02
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch

      {{- if .Values.wazuh.enabled }}
      initContainers:
        - name: seed-wazuh-agent-state
          image: wazuh/wazuh-agent:4.14.4
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
          command: ["/bin/sh", "-lc"]
          args:
            - |
              set -euo pipefail
              mkdir -p /agent
              if [ ! -d /agent/bin ] && [ ! -f /agent/etc/ossec.conf ]; then
                echo "[init] Seeding /var/ossec into PVC..."
                tar -C /var/ossec -cf - . | tar -C /agent -xpf -
              else
                echo "[init] Existing Wazuh agent state found; skipping seed."
              fi
          volumeMounts:
            - name: wazuh-agent-data
              mountPath: /agent

        - name: fix-wazuh-agent-perms
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
          command: ["/bin/sh", "-lc"]
          args:
            - |
              set -e
              for d in etc logs queue var rids tmp active-response; do
                [ -d "/agent/$d" ] && chown -R 999:999 "/agent/$d"
              done
              [ -d /agent/bin ] && chown -R 0:0 /agent/bin || true
              [ -d /agent/lib ] && chown -R 0:0 /agent/lib || true
          volumeMounts:
            - name: wazuh-agent-data
              mountPath: /agent
      {{- end }}

      containers:
        - name: uptime-kuma
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          volumeMounts:
            - name: kuma-data
              mountPath: {{ .Values.persistence.mountPath | quote }}
          {{- if .Values.wazuh.enabled }}
            - name: shared-logs
              mountPath: /shared-logs
          {{- end }}

      {{- if .Values.wazuh.enabled }}
        - name: wazuh-agent
          image: wazuh/wazuh-agent:4.14.4
          imagePullPolicy: IfNotPresent
          env:
            - name: WAZUH_MANAGER
              value: {{ .Values.wazuh.manager | quote }}
            - name: WAZUH_AGENT_NAME
              value: {{ .Values.wazuh.agentName | default (printf "%s-uptime-kuma" .Release.Name) | quote }}
            - name: WAZUH_AGENT_GROUP
              value: {{ .Values.wazuh.group | default "kubernetes" | quote }}
          volumeMounts:
            - name: wazuh-agent-data
              mountPath: /var/ossec
            - name: shared-logs
              mountPath: /shared-logs
            - name: wazuh-agent-config
              mountPath: /wazuh-config-mount/etc/ossec.conf
              subPath: ossec.conf
      {{- end }}

      volumes:
        - name: kuma-data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-pvc" .Release.Name) | quote }}

      {{- if .Values.wazuh.enabled }}
        - name: shared-logs
          emptyDir: {}

        - name: wazuh-agent-data
          persistentVolumeClaim:
            claimName: {{ .Values.wazuh.persistence.existingClaim | default (.Values.wazuh.persistence.name | default (printf "%s-wazuh-agent-pvc" .Release.Name)) | quote }}

        - name: wazuh-agent-config
          configMap:
            name: {{ .Release.Name }}-wazuh-agent-config
      {{- end }}