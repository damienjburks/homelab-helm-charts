replicaCount: 1

image:
  repository: louislam/uptime-kuma
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 3001

persistence:
  enabled: true
  existingClaim: ""
  accessMode: ReadWriteOnce
  size: 5Gi
  storageClass: microk8s-hostpath

ingress:
  className: public
  enabled: true
  host: status.k8s.internal
  annotations: {}
  tls:
    enabled: true
    host: status.k8s.internal
    secretName: app-internal-tls

wazuh:
  enabled: true
  manager: 10.0.0.22
  group: kubernetes
  persistence:
    enabled: true
    existingClaim: ""
    name: ""
    accessMode: ReadWriteOnce
    size: 5Gi
    storageClass: microk8s-hostpath