{{- if .Values.postgres.deleteOnSync }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.postgres.presyncServiceAccount | default (printf "%s-presync" .Release.Name) }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-presync
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-presync
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
subjects:
  - kind: ServiceAccount
    name: {{ .Values.postgres.presyncServiceAccount | default (printf "%s-presync" .Release.Name) }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-presync
  apiGroup: rbac.authorization.k8s.io
{{- end }}
