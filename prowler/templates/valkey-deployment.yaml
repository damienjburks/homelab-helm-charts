apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-valkey
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-valkey
    spec:
      {{- include "prowler.nodeAffinity" . | nindent 6 }}
      {{- if .Values.wazuh.enabled }}
      initContainers:
        {{- include "prowler.wazuhInitContainers" . | nindent 8 }}
      {{- end }}
      containers:
        - name: valkey
          image: "{{ .Values.valkey.image }}:{{ .Values.valkey.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.valkey.port }}
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
              subPath: prowler/valkey
          {{- if .Values.wazuh.enabled }}
            {{- include "prowler.wazuhAppVolumeMount" . | nindent 12 }}
          {{- end }}
      {{- if .Values.wazuh.enabled }}
        {{- include "prowler.wazuhSidecar" (dict "root" . "component" "valkey") | nindent 8 }}
      {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | quote }}
      {{- if .Values.wazuh.enabled }}
        {{- include "prowler.wazuhVolumes" (dict "root" . "component" "valkey") | nindent 8 }}
      {{- end }}
