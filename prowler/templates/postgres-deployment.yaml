apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-postgres
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-postgres
    spec:
      {{- include "prowler.nodeAffinity" . | nindent 6 }}
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      initContainers:
      {{- if .Values.wazuh.enabled }}
        {{- include "prowler.wazuhInitContainers" . | nindent 8 }}
      {{- end }}
        - name: fix-permissions
          image: busybox
          command: ["sh", "-c", "chown -R 999:999 /var/lib/postgresql/data && chmod 0750 /var/lib/postgresql/data"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: prowler/postgres
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image }}:{{ .Values.postgres.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.postgres.port }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.adminUser | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.adminPassword | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U {{ .Values.postgres.adminUser }} -d {{ .Values.postgres.database }}"]
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: prowler/postgres
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
          {{- if .Values.wazuh.enabled }}
            {{- include "prowler.wazuhAppVolumeMount" . | nindent 12 }}
          {{- end }}
      {{- if .Values.wazuh.enabled }}
        {{- include "prowler.wazuhSidecar" (dict "root" . "component" "postgres") | nindent 8 }}
      {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | quote }}
        - name: initdb
          configMap:
            name: {{ .Release.Name }}-postgres-initdb
      {{- if .Values.wazuh.enabled }}
        {{- include "prowler.wazuhVolumes" (dict "root" . "component" "postgres") | nindent 8 }}
      {{- end }}
