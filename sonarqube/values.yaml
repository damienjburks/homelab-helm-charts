replicaCount: 1

image:
  repository: sonarqube
  tag: community
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 9000

sonarqube:
  baseUrl: "https://sonar.burkscloud.xyz"

ingress:
  enabled: true
  className: public
  host: sonarqube.k8s.internal
  annotations: {}
  tls:
    enabled: true
    secretName: app-internal-tls

persistence:
  sonarqube:
    existingClaim: smurkscloud-red-pvc
    dataPath: /mnt/smurkscloud-red/sonarqube/data
    logsPath: /mnt/smurkscloud-red/sonarqube/logs
    extensionsPath: /mnt/smurkscloud-red/sonarqube/extensions
  postgres:
    existingClaim: smurkscloud-red-pvc
    dataPath: /mnt/smurkscloud-red/sonarqube/postgres

postgresql:
  image:
    repository: postgres
    tag: "18"
    pullPolicy: IfNotPresent
  # Set previousTag when upgrading PG major versions to trigger the automated
  # dump/restore migration job. Remove (or leave empty) once the upgrade completes.
  previousTag: "15"
  database: sonarqube
  username: sonar
  password: sonar
  service:
    port: 5432

# Wazuh agent sidecar — disabled until an ARM64-compatible image is available.
# The official wazuh/wazuh-agent image (4.14.x) requires ARMv8.2-a (Graviton 2+),
# and older tags only ship linux/amd64. These nodes schedule across Pi 4 and Pi 5,
# so no official image works here today. Re-enable once a compatible image is sourced
# (e.g. opennix/wazuh-agent or a custom build).
wazuh:
  enabled: false
  # agentImage: wazuh/wazuh-agent:4.7.5
  manager: 10.0.0.22
  group: k8s
  persistence:
    storageClass: microk8s-hostpath
    size: 512Mi
