apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      initContainers:
      {{- if .Values.wazuh.enabled }}
        {{- include "sonarqube.wazuhInitContainers" (dict "root" . "component" "sonarqube") | nindent 8 }}
      {{- end }}
        - name: fix-permissions
          image: busybox
          command: ["sh", "-c", "mkdir -p /opt/sonarqube/data /opt/sonarqube/logs /opt/sonarqube/extensions && chown -R 1000:1000 /opt/sonarqube/data /opt/sonarqube/logs /opt/sonarqube/extensions"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: sonarqube-data
              mountPath: /opt/sonarqube/data
              subPath: sonarqube/data
            - name: sonarqube-data
              mountPath: /opt/sonarqube/logs
              subPath: sonarqube/logs
            - name: sonarqube-data
              mountPath: /opt/sonarqube/extensions
              subPath: sonarqube/extensions
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: sonarqube
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          env:
            - name: SONAR_JDBC_URL
              value: "jdbc:postgresql://{{ .Release.Name }}-postgres:{{ .Values.postgresql.service.port }}/{{ .Values.postgresql.database }}"
            - name: SONAR_CORE_SERVERBASEURL
              value: {{ .Values.sonarqube.baseUrl | quote }}
            - name: SONAR_JDBC_USERNAME
              value: {{ .Values.postgresql.username | quote }}
            - name: SONAR_JDBC_PASSWORD
              value: {{ .Values.postgresql.password | quote }}
            {{- if .Values.saml.enabled }}
            - name: SONAR_AUTH_SAML_ENABLED
              value: "true"
            - name: SONAR_AUTH_SAML_APPLICATIONID
              value: {{ .Values.saml.applicationId | quote }}
            - name: SONAR_AUTH_SAML_PROVIDERNAME
              value: {{ .Values.saml.providerName | quote }}
            - name: SONAR_AUTH_SAML_PROVIDERID
              value: {{ .Values.saml.providerId | quote }}
            - name: SONAR_AUTH_SAML_LOGINURL
              value: {{ .Values.saml.loginUrl | quote }}
            - name: SONAR_AUTH_SAML_CERTIFICATE_SECURED
              value: {{ .Values.saml.certificate | quote }}
            - name: SONAR_AUTH_SAML_USER_LOGIN
              value: {{ .Values.saml.user.login | quote }}
            - name: SONAR_AUTH_SAML_USER_NAME
              value: {{ .Values.saml.user.name | quote }}
            - name: SONAR_AUTH_SAML_USER_EMAIL
              value: {{ .Values.saml.user.email | quote }}
            {{- end }}
          volumeMounts:
            - name: sonarqube-data
              mountPath: /opt/sonarqube/data
              subPath: sonarqube/data
            - name: sonarqube-data
              mountPath: /opt/sonarqube/logs
              subPath: sonarqube/logs
            - name: sonarqube-data
              mountPath: /opt/sonarqube/extensions
              subPath: sonarqube/extensions
          {{- if .Values.wazuh.enabled }}
            {{- include "sonarqube.wazuhAppVolumeMount" . | nindent 12 }}
          {{- end }}
      {{- if .Values.wazuh.enabled }}
        {{- include "sonarqube.wazuhSidecar" (dict "root" . "component" "sonarqube") | nindent 8 }}
      {{- end }}
      volumes:
        - name: sonarqube-data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.sonarqube.existingClaim | quote }}
      {{- if .Values.wazuh.enabled }}
        {{- include "sonarqube.wazuhVolumes" (dict "root" . "component" "sonarqube") | nindent 8 }}
      {{- end }}
