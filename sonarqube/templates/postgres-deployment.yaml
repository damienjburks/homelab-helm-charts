apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-postgres
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-postgres
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      initContainers:
      {{- if .Values.wazuh.enabled }}
        {{- include "sonarqube.wazuhInitContainers" (dict "root" . "component" "postgres") | nindent 8 }}
      {{- end }}
        - name: fix-permissions
          image: busybox
          command: ["sh", "-c"]
          args:
            - |
              set -e
              mkdir -p /var/lib/postgresql/data/pgdata
              chown -R 999:999 /var/lib/postgresql/data/pgdata
              chmod 0750 /var/lib/postgresql/data/pgdata
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: sonarqube/postgres
        - name: fix-pg-hba
          image: busybox
          command: ["sh", "-c"]
          args:
            - |
              set -e
              HBA="/var/lib/postgresql/data/pgdata/pg_hba.conf"
              if [ -f "$HBA" ]; then
                # Ensure network access line exists
                if ! grep -q "^host all all all" "$HBA"; then
                  echo "host all all all scram-sha-256" >> "$HBA"
                  echo "[pg-hba] Added network access rule to pg_hba.conf"
                else
                  echo "[pg-hba] Network access rule already present."
                fi
              else
                echo "[pg-hba] No pg_hba.conf yet (fresh init will create one)."
              fi
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: sonarqube/postgres
      containers:
        - name: postgres
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.postgresql.service.port }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.username | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgresql.password | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_HOST_AUTH_METHOD
              value: "scram-sha-256"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: sonarqube/postgres
          {{- if .Values.wazuh.enabled }}
            {{- include "sonarqube.wazuhAppVolumeMount" . | nindent 12 }}
          {{- end }}
      {{- if .Values.wazuh.enabled }}
        {{- include "sonarqube.wazuhSidecar" (dict "root" . "component" "postgres") | nindent 8 }}
      {{- end }}
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.postgres.existingClaim | quote }}
      {{- if .Values.wazuh.enabled }}
        {{- include "sonarqube.wazuhVolumes" (dict "root" . "component" "postgres") | nindent 8 }}
      {{- end }}
